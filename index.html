<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع السيرة الذاتية الاحترافي - CV Builder</title>
  <!-- مكتبة تحويل الصفحة إلى PDF مباشرة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #2563eb;
      --bg-color: #f8fafc;
      --text-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 25px 15px; }
    
    .main-title { text-align: center; margin-bottom: 25px; color: var(--primary-color); font-size: 28px; font-weight: 700; }
    .container { display: flex; flex-wrap: wrap; gap: 25px; max-width: 1250px; margin: 0 auto; align-items: flex-start; }
    
    /* قسم إدخال البيانات */
    .form-section { 
      flex: 1; 
      min-width: 320px; 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }
    .form-section h2 { margin-bottom: 20px; color: var(--primary-color); font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #475569; }
    .form-group input, .form-group textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-size: 14px; 
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .form-group textarea { height: 90px; resize: vertical; }
    
    /* زر تنزيل الـ PDF */
    .btn-download { 
      width: 100%; 
      padding: 14px; 
      background: linear-gradient(135deg, #2563eb, #1d4ed8); 
      color: #ffffff; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .btn-download:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
    .btn-download:active { transform: translateY(0); }

    /* قسم معاينة السيرة الذاتية الراقية */
    .preview-container { flex: 1.1; min-width: 330px; }
    .preview-section { 
      background: #ffffff; 
      padding: 40px; 
      border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
      border-top: 8px solid var(--accent-color);
      min-height: 600px;
    }
    
    .cv-header { text-align: center; padding-bottom: 20px; border-bottom: 2px solid #f1f5f9; margin-bottom: 25px; }
    .cv-header h1 { color: var(--primary-color); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .cv-header h3 { color: var(--accent-color); font-size: 16px; margin-top: 6px; font-weight: 600; }
    .cv-contact { margin-top: 12px; font-size: 13px; color: #64748b; background: #f8fafc; display: inline-block; padding: 6px 16px; border-radius: 20px; }
    
    .cv-block { margin-bottom: 22px; }
    .cv-block h4 { 
      color: var(--primary-color); 
      font-size: 15px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      margin-bottom: 10px; 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cv-block h4::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--accent-color); border-radius: 2px; }
    .cv-block p { font-size: 14px; line-height: 1.7; color: #334155; white-space: pre-line; background: #fdfdfd; }
  </style>
</head>
<body>

  <h1 class="main-title">صانع السيرة الذاتية الاحترافي</h1>

  <div class="container">
    <!-- نموذج كتابة البيانات -->
    <div class="form-section">
      <h2>معلوماتك الشخصية</h2>
      
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="inputName" placeholder="مثال: محمد علي" oninput="updateCV()">
      </div>

      <div class="form-group">
        <label>المسمى الوظيفي / التخصص</label>
        <input type="text" id="inputTitle" placeholder="مثال: مهندس برمجيات" oninput="updateCV()">
      </div>

      <div class="form-group">
        <label>معلومات الاتصال (الإيميل، الهاتف، المدينة)</label>
        <input type="text" id="inputContact" placeholder="email@example.com | 0791234567 | عمان" oninput="updateCV()">
      </div>

      <div class="form-group">
        <label>نبذة تعريفية (About Me)</label>
        <textarea id="inputAbout" placeholder="اكتب نبذة مختصرة عن مهاراتك وشغفك..." oninput="updateCV()"></textarea>
      </div>

      <div class="form-group">
        <label>الخبرات والدورات التدريبية</label>
        <textarea id="inputExperience" placeholder="• شركة كذا - مسمى وظيفي (2022 - 2024)&#10;• دورة تطوير المواقع..." oninput="updateCV()"></textarea>
      </div>

      <div class="form-group">
        <label>المهارات الأكاديمية والتقنية</label>
        <textarea id="inputSkills" placeholder="• البرمجة بلغة C++&#10;• إدارة المشاريع&#10;• حل المشكلات" oninput="updateCV()"></textarea>
      </div>

      <button class="btn-download" onclick="downloadPDF()">تنزيل ملف PDF مباشر</button>
    </div>

    <!-- شكل السيرة الذاتية للمعاينة وللتنزيل -->
    <div class="preview-container">
      <div class="preview-section" id="cvPreview">
        <div class="cv-header">
          <h1 id="pvName">الاسم الكامل</h1>
          <h3 id="pvTitle">المسمى الوظيفي</h3>
          <div class="cv-contact" id="pvContact">email@example.com | 0791234567 | المدينة</div>
        </div>

        <div class="cv-block">
          <h4>النبذة التعريفية</h4>
          <p id="pvAbout">ستظهر النبذة التعريفية هنا بمجرد كتابتها في النموذج على اليمين...</p>
        </div>

        <div class="cv-block">
          <h4>الخبرات والدورات</h4>
          <p id="pvExperience">ستظهر الخبرات والتفاصيل هنا...</p>
        </div>

        <div class="cv-block">
          <h4>المهارات</h4>
          <p id="pvSkills">ستظهر المهارات والقدرات هنا...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // تحديث المعاينة المباشرة أثناء الكتابة
    function updateCV() {
      document.getElementById('pvName').innerText = document.getElementById('inputName').value || 'الاسم الكامل';
      document.getElementById('pvTitle').innerText = document.getElementById('inputTitle').value || 'المسمى الوظيفي';
      document.getElementById('pvContact').innerText = document.getElementById('inputContact').value || 'email@example.com | 0791234567 | المدينة';
      document.getElementById('pvAbout').innerText = document.getElementById('inputAbout').value || 'ستظهر النبذة التعريفية هنا بمجرد كتابتها في النموذج...';
      document.getElementById('pvExperience').innerText = document.getElementById('inputExperience').value || 'ستظهر الخبرات والتفاصيل هنا...';
      document.getElementById('pvSkills').innerText = document.getElementById('inputSkills').value || 'ستظهر المهارات والقدرات هنا...';
    }

    // دالة تحويل المعاينة إلى ملف PDF وتنزيله فوراً
    function downloadPDF() {
      const element = document.getElementById('cvPreview');
      const userName = document.getElementById('inputName').value || 'CV';
      
      const opt = {
        margin:       10,
        filename:     `${userName}_CV.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>

</body>
</html>

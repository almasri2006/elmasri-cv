<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElMasri CV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 16px;
      background: #0284c7;
      color: #fff;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>ElMasri CV</h1>
    <p>جاري تطوير السيرة الذاتية بتصميم حديث واحترافي...</p>
    <span class="badge">قريباً</span>
  </div>

</body>
</html>
